# 名片胸卡生成器：前后端分离部署。
#
# 前端（frontend/dist）由 nginx 直接托管，/api 与 Active Storage
# 反代给 Rails。前后端同源，因此不需要 CORS 配置。
#
# 只监听 127.0.0.1：cards 接口目前没有任何鉴权，任何访问者都能拉取
# 全部记录，含原始简历文本与证件照。对外暴露前必须先补访问控制。
# 部署方式见 deploy/README.md。

upstream badge_rails {
    server 127.0.0.1:8000;
}

server {
    listen 127.0.0.1:8080;
    server_name localhost;

    # 构建产物部署到 /var/www 而非直读 frontend/dist：
    # nginx 以 www-data 运行，读后者需要放宽 /home/ubuntu 的权限
    # （默认 0750，Ubuntu 有意用它隔离家目录）。用 deploy/publish.sh 发布。
    root /var/www/badge-generator;
    index index.html;

    # 上传的文档和证件照会超过默认的 1M 上限（照片上限 5M）。
    client_max_body_size 12m;

    # 构建产物带内容哈希，可长期缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://badge_rails;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 提取一次可能跑几十秒（两次重试 + 模型响应），
        # 默认 60s 会在提取完成前就断开。
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 证件照走 Active Storage 的 proxy 路由。
    location /rails/active_storage/ {
        proxy_pass http://badge_rails;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退：/design 这类前端路由要交给 index.html，
    # 否则刷新页面会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
