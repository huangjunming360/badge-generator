[project]
name = "badge-template-agent"
version = "0.2.0"
description = "Private GPU worker for Badge Generator template visual review"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "tenacity>=8.3,<10",
]

[project.optional-dependencies]
visual = [
  "openai>=1.30,<2",
]

[project.scripts]
badge-template-agent = "template_agent.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/template_agent"]
