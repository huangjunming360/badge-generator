services:
  mai-vllm:
    image: vllm/vllm-openai:v0.11.0
    command:
      - --model=/models/MAI-UI-8B
      - --served-model-name=MAI-UI-8B
      - --host=0.0.0.0
      - --port=8000
      - --tensor-parallel-size=1
      - --trust-remote-code
      # 4090 的 24GB 显存需要为 BF16 权重和视觉上下文预留足够的 KV cache。
      - --gpu-memory-utilization=0.90
      - --max-model-len=8192
      - --max-num-seqs=1
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ${MAI_MODEL_DIR:-./models/MAI-UI-8B}:/models/MAI-UI-8B:ro
    ipc: host
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
