test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

# 本地磁盘存储。数据放在独立的 data 目录下，与 SQLite 数据库分离。
# 可通过 STORAGE_PATH 环境变量自定义路径。
local:
  service: Disk
  root: <%= ENV.fetch("STORAGE_PATH", Rails.root.join("storage/data")) %>

# ── 以下为云存储模板，改 active_storage.service 即可切换 ──

# 阿里云 OSS（S3 兼容协议，无需 SDK）
# aliyun:
#   service: S3
#   access_key_id: <%= ENV["OSS_ACCESS_KEY_ID"] %>
#   secret_access_key: <%= ENV["OSS_ACCESS_KEY_SECRET"] %>
#   region: <%= ENV.fetch("OSS_REGION", "oss-cn-hangzhou") %>
#   bucket: <%= ENV["OSS_BUCKET"] %>
#   endpoint: https://oss-cn-hangzhou.aliyuncs.com
#   force_path_style: true

# AWS S3
# aws:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your-bucket-<%= Rails.env %>

# 从本地迁移到云存储的步骤：
# 1. 取消上面目标服务的注释，在 production.rb 切换 service
# 2. 设好环境变量，重启
# 3. 新文件自动写入云端，旧文件用迁移脚本：
#    blob = ActiveStorage::Blob.find_each
#    blob.each { |b| b.service.upload(b.key, StringIO.new(b.download)) }
